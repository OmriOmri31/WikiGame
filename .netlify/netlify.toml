headersOrigin = "config"
redirectsOrigin = "config"
plugins = []
functionsDirectory = "/workspace/WikiGame/netlify/functions"
functionsDirectoryOrigin = "config"

[functions]

[functions."*"]

[build]
publish = "/workspace/WikiGame/dist"
publishOrigin = "config"
commandOrigin = "config"
command = "npm ci && npm run build"
base = "/workspace/WikiGame/web"
functions = "/workspace/WikiGame/netlify/functions"

[build.environment]
NODE_VERSION = "22.20.0"

[build.processing]

[build.processing.css]

[build.processing.html]

[build.processing.images]

[build.processing.js]

[build.services]

[[headers]]
for = "/*"

[headers.values]
Content-Security-Policy = "base-uri 'self'; object-src 'none'; script-src 'self' https://apis.google.com https://www.gstatic.com https://www.google.com https://accounts.google.com https://wikigame-5ebec.firebaseapp.com https://*.googleapis.com"

[[redirects]]
from = "/*"
to = "/index.html"
status = 200.0
force = false

[redirects.query]

[redirects.conditions]

[redirects.headers]