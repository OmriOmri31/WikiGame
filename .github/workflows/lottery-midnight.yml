name: Publish the daily lottery

on:
  schedule:
    # GitHub often starts scheduled runs late, so start ~20 minutes before Israel midnight
    # and let the script wait for 00:00. 20:40 UTC is 23:40 in summer (UTC+3), 21:40 UTC is
    # 23:40 in winter (UTC+2). The later runs are catch-ups; the date key stops double publishing,
    # and they also put the queued pair back if another writer replaced it.
    - cron: '40 20 * * *'
    - cron: '40 21 * * *'
    - cron: '10 22 * * *'
    - cron: '40 22 * * *'
  workflow_dispatch:

concurrency:
  group: lottery-midnight
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install web dependencies
        run: npm ci --prefix web
      - name: Publish today's pair and refill the queue
        run: node web/scripts/publishLottery.js
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
