name: Publish the daily lottery

on:
  schedule:
    # Midnight in Israel: 21:00 UTC while the clock is UTC+3, 22:00 UTC while it is UTC+2.
    # In winter the 21:00 UTC run is still 23:00, and the script waits for midnight.
    # The date key stops the later run from publishing twice.
    - cron: '0 21 * * *'
    - cron: '0 22 * * *'
  workflow_dispatch:

concurrency:
  group: lottery-midnight
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install web dependencies
        run: npm ci --prefix web
      - name: Publish today's pair and refill the queue
        run: node web/scripts/publishLottery.js
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
