name: Daily reasoning player

on:
  schedule:
    # Shortly after Israel midnight in both summer (UTC+3) and winter (UTC+2).
    - cron: '20 21 * * *'
    - cron: '20 22 * * *'
  workflow_dispatch:

concurrency:
  group: reasoner-daily
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  play:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install web dependencies
        run: npm ci --prefix web
      - name: Play today's daily game
        run: node scripts/reasonerDaily.js
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
